[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "swsans"
version = "0.1.0"
description = "Stoner-Wohlfarth ensemble simulations and magnetic SANS observables"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Michael P. Adams" }]
keywords = [
  "magnetic SANS",
  "Stoner-Wohlfarth",
  "Landau-Lifshitz",
  "nanoparticles",
  "scientific software",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]
web = [
  "matplotlib>=3.9,<4",
  "shiny>=1.8,<2",
  "shinylive==0.8.12",
]
dev = [
  "mypy>=1.14,<2",
  "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://adamsmp92.github.io/SWSANS_python/"
Repository = "https://github.com/AdamsMP92/SWSANS_python"
Issues = "https://github.com/AdamsMP92/SWSANS_python/issues"
Publication = "https://doi.org/10.1107/S205225252300180X"

[tool.hatch.build.targets.wheel]
packages = ["src/swsans"]

[tool.pytest.ini_options]
addopts = "-q -m 'not slow'"
testpaths = ["tests"]
markers = ["slow: higher-cost scientific reference checks"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/swsans"]
strict = true
ignore_missing_imports = true

